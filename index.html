<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jerusalem, c. 66 CE</title>
  <meta name="description" content="Jerusalem on the eve of the Great Revolt in explorable 3D: Herod's Temple Mount, the three city walls, palaces, pools and tombs, each with its sources and evidence rating.">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="show-sidebar show-inspector">
    <header class="toolbar">
      <button class="icon-btn" id="toggle-sidebar" title="Show or hide the landmark list" aria-label="Landmarks">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <div class="segmented" role="radiogroup" aria-label="View" title="Orbit above the city, or walk its streets">
        <button data-mode="orbit" class="on" role="radio" aria-checked="true">Orbit</button>
        <button data-mode="walk" role="radio" aria-checked="false">Walk</button>
      </div>
      <h1>Jerusalem, c. 66 CE</h1>
      <div class="spacer"></div>
      <label class="sun" title="Time of day (local solar time)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <input type="range" id="hour" min="4" max="20" step="0.05" value="9.5" aria-label="Time of day">
        <span id="time-label">09:30</span>
      </label>
      <select id="season" title="Season, which sets the height of the sun" aria-label="Season">
        <option value="80">Equinox</option>
        <option value="172">Midsummer</option>
        <option value="355">Midwinter</option>
      </select>
      <select id="sky" title="How much cloud is in the sky" aria-label="Sky">
        <option value="0.22">Clear</option>
        <option value="0.42" selected>Fair</option>
        <option value="0.74">Cloudy</option>
      </select>
      <button class="icon-btn toggle" id="evidence" title="Colour every structure by how well it is attested" aria-label="Evidence" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      </button>
      <button class="icon-btn toggle on" id="labels" title="Show landmark names" aria-label="Labels" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      </button>
      <button class="icon-btn" id="overview" title="Return to the overview" aria-label="Overview">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
      </button>
      <button class="icon-btn" id="sources" title="Bibliography and accuracy notes" aria-label="Sources">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16 5l3.5-1 3 15.5-3.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="toggle-inspector" title="Show or hide the details panel" aria-label="Details">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </header>

    <aside class="sidebar" aria-label="Landmarks">
      <input type="search" id="search" placeholder="Find a landmark" aria-label="Find a landmark">
      <nav id="landmarks"></nav>
    </aside>

    <main class="viewport" id="viewport">
      <div class="hud">
        <div class="legend" id="legend" hidden></div>
        <div class="help" id="help">Drag to orbit · scroll or pinch to zoom · right-drag or Option-drag to pan · click a building for its sources</div>
      </div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Building Jerusalem, c. 66 CE</div>
        <div class="bar"><div id="loading-bar"></div></div>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Details"></aside>
  </div>

  <dialog id="sources-dialog">
    <header><h2>Sources and accuracy</h2><button id="sources-done" autofocus>Done</button></header>
    <div class="dialog-body" id="sources-body"></div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
